[package]
name = "fungi-daemon"
description = "fungid: the background process that drives fungi sessions"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fungid"
path = "src/main.rs"

[dependencies]
bitcoin = "=0.32.8"
clap = { version = "4", features = ["derive"] }
cost-function = { path = "../cost-function" }
fungi-core = { path = "../core" }
fungi-driver = { path = "../driver" }
fungi-rpc = { path = "../rpc" }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
