[package]
name = "fungi-aead"
description = "XChaCha20Poly1305 with random nonces"
version.workspace = true
edition.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = [
  "getrandom",
  "zeroize",
] }
thiserror = "2"
zeroize = { version = "1", default-features = false, features = ["derive"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
